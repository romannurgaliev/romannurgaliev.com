# Records the Linux screenshots for the browser tests and commits them.
# Run by hand from the Actions tab: once to start, and after any deliberate
# visual change to the simulator (the macOS set is updated locally with
# npm run test:ui -- --update-snapshots=all).
name: Update Linux screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Must match the image in test.yml
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Record screenshots
        run: npx playwright test --grep @visual --update-snapshots=all
      - name: Check they are stable (three more runs must match)
        run: npx playwright test --grep @visual --repeat-each=3
      - name: Commit them
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/screenshots/*-linux.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged, nothing to commit."
          else
            git commit -m "Linux screenshots for browser tests"
            git push
            echo "::notice::Committed. Pushes from this bot don't start the Tests workflow; re-run it from the Actions tab to see the screenshot tests pass."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-screenshots
          path: tests/ui/screenshots/*-linux.png
          retention-days: 14
